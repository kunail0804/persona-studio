sonar.projectKey=kunail0804_persona-studio
sonar.organization=kunail0804

sonar.sources=persona_studio,web/src
sonar.exclusions=web/dist/**,**/node_modules/**,.venv/**,data/**

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml

# V1 deliberately ships no front-end test runner — the front is covered by
# oxlint, tsc and the build instead. Without this exclusion every pull
# request fails a coverage condition it can never meet.
sonar.coverage.exclusions=web/src/**
